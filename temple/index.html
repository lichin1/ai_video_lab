<script>
  // 防呆：任何人誤用 Math.random 也只會得到固定序列（每次打開都一樣）
  (function () {
    let a = 20261020;
    Math.random = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  })();
</script>
