<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4ecdc; }
  #wrap { position: relative; width: 1920px; height: 1080px; }
  #stage { position: absolute; left: 0; top: 0; }
  #grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; mix-blend-mode: multiply; opacity: 0.45; pointer-events: none; }
  #subs { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; pointer-events: none; }
  #subbox { background: rgba(48, 38, 28, 0.56); border-radius: 18px; padding: 14px 40px 16px; text-align: center; max-width: 1560px; box-shadow: 0 2px 22px rgba(48, 38, 28, 0.18); }
  #zh { font-family: 'Noto Sans CJK TC', sans-serif; font-weight: 500; font-size: 46px; line-height: 1.3; color: #fffaf0; letter-spacing: 2px; }
  #en { font-family: 'Noto Serif', 'DejaVu Serif', serif; font-style: italic; font-size: 29px; line-height: 1.35; color: #f3e6cf; margin-top: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <img id="grain" src="paper.png">
  <div id="subs"><div id="subbox"><div id="zh"></div><div id="en"></div></div></div>
</div>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
const stage = document.getElementById('stage');
const subs = document.getElementById('subs');
const zhEl = document.getElementById('zh'), enEl = document.getElementById('en');
let TL = null;
const XF = 2.0;   // old scene fades out while the new one draws on (seconds)

// Story scenes look slightly low so the action sits above the subtitle band.
const CAM_DY = { s02_title: 0, s10_endcard: 0, s08_recent: 150 };
function sceneSVG(sc, local) {
  CUR.t = local;
  const r = SCENES[sc.id](sc.lines, sc.dur);
  const [cx, cy, z] = r.cam;
  const dy = CAM_DY[sc.id] === undefined ? 80 : CAM_DY[sc.id];
  return `<g transform="translate(960 540) scale(${z.toFixed(5)}) translate(${(-cx).toFixed(2)} ${(-cy - dy).toFixed(2)})">${r.svg}</g>` + (r.hud || '');
}

function logoBug(T, sc, local) {
  // Small emblem in the corner through the story scenes.
  const on = ['s03_founding', 's04_chairs', 's05_scholarship', 's06_blood', 's07_rain', 's08_recent', 's09_ending'];
  if (!on.includes(sc.id)) return '';
  CUR.t = local;
  let o = 1;
  if (sc.id === 's03_founding') o = eout(clamp((local - 1) / 1.2));
  if (sc.id === 's09_ending') o = 1 - eout(clamp((local - sc.lines[1].s + 0.5) / 1));
  return op(o * 0.92, kianshanLogo(92, 92, 0.36, 1));
}

window.setup = async function (tl, logos) {
  TL = tl;
  window.LOGOS = logos || {};
  await document.fonts.load("700 40px 'Noto Serif CJK TC'");
  await document.fonts.load("900 40px 'Noto Serif CJK TC'");
  await document.fonts.load("500 40px 'Noto Sans CJK TC'");
  await document.fonts.load("400 40px 'Noto Sans CJK TC'");
  await document.fonts.load("italic 30px 'Noto Serif'");
  await document.fonts.ready;
  const img = document.getElementById('grain');
  if (!img.complete) await new Promise(r => img.onload = r);
  await img.decode();
  return true;
};

window.renderFrame = async function (f) {
  const T = f / TL.fps;
  CUR.T = T; CUR.frame = f; _clipId = 0;
  const scs = TL.scenes;
  let i = scs.findIndex(s => T >= s.start && T < s.start + s.dur);
  if (i < 0) i = scs.length - 1;
  const sc = scs[i];
  const local = T - sc.start;
  let body = '';
  // incoming scene fades in over the tail of the previous one
  // The new scene draws itself over the old one while the old one fades,
  // so there is never an empty page mid-transition.
  if (i > 0 && local < XF) {
    const prev = scs[i - 1];
    body += `<g opacity="${(1 - ease(local / XF)).toFixed(3)}">${sceneSVG(prev, prev.dur + local)}</g>`;
    body += `<g opacity="${eout(clamp(local / 0.35)).toFixed(3)}">${sceneSVG(sc, local)}</g>`;
  } else {
    body += sceneSVG(sc, local);
  }
  // final fade to paper
  const endFade = clamp((T - (TL.total - 1.6)) / 1.4);
  body += logoBug(T, sc, local);
  if (endFade > 0) body += `<rect x="0" y="0" width="1920" height="1080" fill="#f4ecdc" opacity="${endFade.toFixed(3)}"/>`;
  const seed = Math.floor(f / 3) % 9 + 1;   // "boiling" hand-drawn line: new wobble every 3 frames
  stage.innerHTML =
    `<defs><filter id="rough" x="0" y="0" width="1920" height="1080" filterUnits="userSpaceOnUse">` +
    `<feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="${seed}" result="n"/>` +
    `<feDisplacementMap in="SourceGraphic" in2="n" scale="4.2" xChannelSelector="R" yChannelSelector="G"/></filter>` +
    `<clipPath id="streetClip"><rect x="-600" y="842" width="4200" height="900"/></clipPath></defs>` +
    `<rect x="0" y="0" width="1920" height="1080" fill="#f4ecdc"/>` +
    `<g filter="url(#rough)">${body}</g>`;

  // subtitles
  CUR.t = local;
  const ln = sc.lines.find(l => local >= l.s - 0.05 && local <= l.e + 0.35);
  if (ln) {
    const a = Math.min(clamp((local - l0(ln)) / 0.2), clamp((ln.e + 0.35 - local) / 0.2));
    zhEl.textContent = ln.zh; enEl.textContent = ln.en;
    subs.style.opacity = a.toFixed(3);
  } else {
    subs.style.opacity = '0';
  }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  return stage.innerHTML.length;
};
function l0(ln) { return ln.s - 0.05; }
</script>
</body>
</html>
